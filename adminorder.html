<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Warung Basecamp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-900 font-sans text-stone-200 pb-10 min-h-screen">

    <div class="max-w-2xl mx-auto p-4">
        
        <!-- Header Admin & Tombol Riset -->
        <div class="flex flex-col sm:flex-row justify-between items-center bg-stone-800 p-4 rounded-xl shadow-lg border border-stone-700 mb-6 gap-4 sticky top-4 z-10">
            <h1 class="text-xl sm:text-2xl font-bold text-amber-500">🛠️ Dashboard Admin</h1>
            
            <button onclick="risetSemuaPesanan()" class="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg flex items-center justify-center gap-2 transition active:scale-95">
                <span class="text-lg">🗑️</span> RISET PESANAN
            </button>
        </div>

        <!-- Tempat Daftar Pesanan Muncul -->
        <div id="list-pesanan" class="space-y-4">
            <p class="text-stone-400 animate-pulse text-center mt-10">Mengambil data pesanan masuk...</p>
        </div>

    </div>

    <script>
        // KREDENSIAL SUPABASE
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';
        const clientDB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // FUNGSI MENGAMBIL DATA PESANAN
        async function ambilPesanan() {
            const { data, error } = await clientDB.from('pesanan_warung')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(30); // Menampilkan 30 pesanan terakhir

            const wadah = document.getElementById('list-pesanan');
            
            if (error) { wadah.innerHTML = `<p class="text-red-500 text-center font-bold">Error database: ${error.message}</p>`; return; }
            if (data.length === 0) { wadah.innerHTML = `<div class="text-center py-10"><span class="text-5xl block mb-3">📭</span><p class="text-stone-500 font-bold text-lg">Belum ada pesanan masuk / Layar sudah di-Riset.</p></div>`; return; }

            let html = '';
            data.forEach(p => {
                let items = p.detail_pesanan.map(i => `${i.jumlah}x ${i.nama}`).join(', ');
                
                // Mengatur warna latar (background) berdasarkan status pesanan
                let bgWarna = 'bg-stone-800 border-stone-600'; // Default (Pending)
                let iconStatus = '🕒';
                
                if (p.status === 'Diproses') { bgWarna = 'bg-blue-950 border-blue-600'; iconStatus = '👨‍🍳'; }
                else if (p.status === 'Dikirim') { bgWarna = 'bg-orange-950 border-orange-600'; iconStatus = '🛵'; }
                else if (p.status === 'Selesai') { bgWarna = 'bg-green-950 border-green-600 opacity-60'; iconStatus = '✅'; }

                html += `
                    <div class="${bgWarna} border-2 p-4 rounded-xl shadow-lg transition-all">
                        <div class="flex justify-between items-start border-b border-white/10 pb-2 mb-2">
                            <div>
                                <h2 class="font-bold text-lg text-amber-400">${p.nama_pemesan}</h2>
                                <span class="text-xs font-bold bg-white/10 px-2 py-0.5 rounded text-white mt-1 inline-block">${iconStatus} ${p.status || 'Pending'}</span>
                            </div>
                            <div class="text-right">
                                <p class="font-extrabold text-white text-lg">Rp ${p.total_harga.toLocaleString('id-ID')}</p>
                                <p class="text-[10px] text-stone-400">${new Date(p.created_at).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'})}</p>
                            </div>
                        </div>
                        
                        <p class="text-sm mb-3 text-stone-200">📝 <span class="font-bold text-amber-100">${items}</span></p>
                        
                        <!-- Tombol Aksi Admin -->
                        <div class="flex gap-2 mt-4">
                            <button onclick="ubahStatus('${p.id}', 'Diproses')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg font-bold text-xs sm:text-sm transition active:scale-95 shadow-md">👨‍🍳 Proses</button>
                            <button onclick="ubahStatus('${p.id}', 'Dikirim')" class="flex-1 bg-orange-600 hover:bg-orange-500 text-white py-2 rounded-lg font-bold text-xs sm:text-sm transition active:scale-95 shadow-md">🛵 Kirim</button>
                            <button onclick="ubahStatus('${p.id}', 'Selesai')" class="flex-1 bg-green-600 hover:bg-green-500 text-white py-2 rounded-lg font-bold text-xs sm:text-sm transition active:scale-95 shadow-md">✅ Selesai</button>
                        </div>
                    </div>
                `;
            });
            wadah.innerHTML = html;
        }

        // FUNGSI MENGUBAH STATUS (Otomatis update di HP Pelanggan)
        async function ubahStatus(id, statusBaru) {
            const { error } = await clientDB.from('pesanan_warung').update({ status: statusBaru }).eq('id', id);
            if (error) {
                alert("Gagal mengubah status!");
            } else {
                ambilPesanan(); // Segarkan layar admin
            }
        }

        // FUNGSI RISET (HAPUS SEMUA DATA)
        async function risetSemuaPesanan() {
            const konfirmasi = confirm("⚠️ PERINGATAN!\n\nApakah kamu yakin ingin MERISET (menghapus) semua pesanan di layar ini?\nData tidak bisa dikembalikan setelah dihapus.");
            
            if (konfirmasi) {
                // Trik menghapus seluruh data di Supabase (menghapus semua harga yang >= 0)
                const { error } = await clientDB.from('pesanan_warung').delete().gte('total_harga', 0);
                
                if (error) {
                    alert("Gagal meriset data: " + error.message);
                } else {
                    alert("Berhasil! Semua pesanan telah dibersihkan.");
                    ambilPesanan(); // Segarkan layar jadi kosong
                }
            }
        }

        // TAMPILKAN DATA SAAT WEB DIBUKA
        ambilPesanan();
        
        // FITUR OTOMATIS: Dengar jika ada pesanan baru masuk dari pelanggan
        clientDB.channel('admin-tracker')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pesanan_warung' }, payload => {
                // Mainkan suara notifikasi saat ada pesanan masuk
                let audioTing = new Audio('https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg');
                audioTing.play().catch(e => console.log("Browser memblokir suara otomatis"));
                
                alert("🔔 ADA PESANAN BARU MASUK!");
                ambilPesanan();
            }).subscribe();
    </script>
</body>
</html>
