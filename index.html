<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Kopi Siap Antar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes jalan-maju {
            0% { transform: translateX(-10px) scaleX(-1); }
            50% { transform: translateX(10px) scaleX(-1); }
            100% { transform: translateX(-10px) scaleX(-1); }
        }
        .animasi-jalan-maju { animation: jalan-maju 1.5s infinite ease-in-out; display: inline-block; }

        @keyframes lompat-jalan {
            0%, 100% { transform: translateY(0) scaleX(-1); }
            50% { transform: translateY(-8px) scaleX(-1); }
        }
        .animasi-kurir-jalan { animation: lompat-jalan 0.6s infinite; }
        
        .kurir-diam { transform: scaleX(-1); }
    </style>
</head>
<body class="bg-stone-100 font-sans pb-24">

    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 -translate-y-24 opacity-0 z-[100] transition-all duration-300 pointer-events-none w-[90%] max-w-sm">
        <div id="toast-content" class="px-6 py-3 rounded-full shadow-2xl text-sm font-bold text-white flex items-center justify-center gap-2"></div>
    </div>

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg overflow-hidden border border-stone-200 relative">
        
        <div class="bg-[#292524] text-amber-50 p-4 sticky top-0 z-10 shadow-md border-b-4 border-[#d97706]" id="header-utama">
            <h1 class="text-xl font-extrabold text-center tracking-wide text-[#f59e0b] leading-snug">☕PINGIN NGOPI KARO UDUT TAPI MAGER</h1>
            <p class="text-center text-sm text-stone-200 mt-1">warung kopi siap antar <span class="animasi-jalan-maju">🚶</span></p>
        </div>

        <div class="p-4 bg-stone-50 min-h-screen" id="halaman-beranda">
            <h2 class="text-lg font-bold text-stone-800 mb-3 sticky top-[92px] bg-stone-50 z-10 pt-2 pb-1">Daftar Menu</h2>
            <div id="kategori-container" class="flex gap-2 overflow-x-auto hide-scroll mb-4 pb-2 border-b-2 border-stone-200 sticky top-[132px] bg-stone-50 z-10"></div>
            <div id="ruang-menu" class="grid grid-cols-2 gap-4"></div>
        </div>

        <div class="min-h-screen bg-[#131722] text-white p-5 flex-col items-center pt-8 pb-24 hidden" id="halaman-lacak-visual">
            <h3 class="text-[#22c55e] font-extrabold text-xs tracking-[0.2em] mb-3 text-center">LIVE TRACKING</h3>
            <h1 id="teks-status-lacak" class="text-2xl font-extrabold italic text-white mb-10 text-center tracking-wide">MENCARI PESANAN...</h1>

            <div class="bg-[#1e2536] w-full rounded-[2rem] p-6 relative h-64 shadow-2xl border border-gray-700/50 mb-8">
                <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 100 100">
                    <path d="M 20,75 C 40,75 50,25 80,25" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
                </svg>
                
                <div class="absolute bottom-[10%] left-[8%] flex flex-col items-center z-10">
                    <div class="text-4xl bg-[#1e2536] rounded-full p-2 mb-1 border-b-[3px] border-blue-400">🏪</div>
                    <span class="text-[10px] text-gray-500 font-bold tracking-wider">WARUNG</span>
                </div>
                
                <div class="absolute top-[8%] right-[8%] flex flex-col items-center z-10">
                    <div class="text-4xl bg-[#1e2536] rounded-full p-2 mb-1 border-b-[3px] border-orange-400">🏠</div>
                    <span class="text-[10px] text-gray-500 font-bold tracking-wider">RUMAH</span>
                </div>
                
                <div id="ikon-kurir" class="absolute text-5xl transition-all duration-1000 ease-in-out z-20 kurir-diam" style="left: 10%; top: 55%;">
                    🚶
                </div>
            </div>

            <div class="bg-[#1e2536] rounded-2xl w-full p-5 text-center italic text-gray-400 text-sm font-medium border border-gray-800">
                <span id="pesan-motivasi">"Mohon tunggu ya, pesananmu sedang diproses!"</span>
            </div>

            <button onclick="bukaBeranda()" class="mt-6 bg-[#161b28] border border-gray-700 w-full py-4 rounded-xl font-extrabold text-sm text-gray-300 hover:text-white hover:bg-gray-800 transition shadow-lg tracking-wide">
                KEMBALI KE MENU
            </button>
        </div>

        <div id="modal-lacak" class="hidden fixed inset-0 bg-black/80 z-50 flex justify-center items-center p-5">
            <div class="bg-[#242b3d] w-full max-w-sm rounded-[2rem] p-6 shadow-2xl border border-gray-700 relative animate-[slideUp_0.2s_ease-out]">
                <button onclick="tutupModalLacak()" class="absolute top-5 right-6 text-gray-400 hover:text-white text-2xl font-light">&times;</button>
                <h2 class="text-white font-extrabold italic text-lg mb-6 tracking-wide mt-2">LACAK PESANAN</h2>
                
                <input type="text" id="input-nama-lacak" class="w-full bg-[#1b2130] border border-gray-600 rounded-2xl p-4 text-white placeholder-gray-500 outline-none focus:border-[#22c55e] mb-6 font-bold text-sm transition" placeholder="Ketik Nama Pembeli...">
                
                <button id="btn-cari-lacak" onclick="cariPesanan()" class="w-full bg-[#22c55e] text-white font-extrabold py-4 rounded-xl shadow-[0_4px_20px_rgba(34,197,94,0.3)] active:scale-95 transition tracking-wider text-sm">
                    CARI
                </button>
            </div>
        </div>

        <div id="modal-checkout" class="hidden fixed inset-0 bg-black/60 z-50 flex justify-center items-end sm:items-center">
            <div class="bg-white w-full max-w-md p-6 rounded-t-2xl sm:rounded-2xl shadow-2xl animate-[slideUp_0.3s_ease-out] max-h-[90vh] flex flex-col">
                <div class="flex justify-between items-center mb-4 border-b pb-2 shrink-0">
                    <h2 class="text-xl font-bold text-stone-800">Keranjang</h2>
                    <button onclick="tutupCheckout()" class="text-stone-400 hover:text-red-500 font-bold text-3xl">&times;</button>
                </div>
                
                <div class="overflow-y-auto hide-scroll mb-2 shrink">
                    <div class="bg-stone-50 p-3 rounded-lg border border-stone-200">
                        <div id="daftar-pesanan-checkout" class="flex flex-col"></div>
                        <div class="flex justify-between items-center border-t border-stone-300 pt-3 mt-2">
                            <span class="font-bold text-stone-800">Total Harga:</span>
                            <span id="total-harga-checkout" class="font-extrabold text-[#d97706] text-xl">Rp 0</span>
                        </div>
                    </div>
                </div>
                
                <div class="space-y-4 shrink-0 mt-3 border-t-2 border-stone-100 pt-4">
                    <div>
                        <label class="block text-stone-800 font-extrabold text-base mb-2" for="nama-pemesan">Nama Pemesan:</label>
                        <input type="text" id="nama-pemesan" class="w-full border-2 border-stone-300 rounded-xl p-3 text-lg focus:border-[#d97706] outline-none font-bold placeholder-stone-400" placeholder="Ketik nama...">
                    </div>
                    
                    <div>
                        <select id="metode-bayar" class="w-full border-2 border-stone-300 rounded-xl p-3 bg-stone-50 text-stone-700 font-bold outline-none">
                            <option value="COD">💵 Bayar di Tempat (COD)</option>
                        </select>
                    </div>
                    
                    <button id="btn-kirim" onclick="kirimPesanan()" class="w-full bg-[#d97706] text-white font-extrabold py-3.5 mt-2 rounded-xl shadow-lg active:scale-95 transition text-lg">
                        Kirim Pesanan
                    </button>
                </div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1a1f2e] border-t border-gray-800 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.5)] z-40 flex justify-between items-center px-10 py-3 pb-safe rounded-t-3xl" id="nav-bawah">
            <button onclick="bukaModalLacak()" class="flex flex-col items-center text-gray-400 hover:text-white transition relative">
                <span class="text-2xl">🔍</span><span class="text-[10px] font-extrabold mt-1 tracking-wide">LACAK</span>
            </button>
            <button onclick="bukaCheckout()" class="flex flex-col items-center text-gray-400 hover:text-white transition relative">
                <span class="text-2xl">🛒</span><span class="text-[10px] font-extrabold mt-1 tracking-wide">KERANJANG</span>
                <span id="jumlah-item-bawah" class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold shadow-sm hidden">0</span>
            </button>
            <button onclick="bukaBeranda()" class="flex flex-col items-center text-[#22c55e] hover:text-green-400 transition relative bg-[#1f2937] p-3 rounded-2xl -mt-8 shadow-lg border border-gray-700">
                <span class="text-3xl">🏠</span><span class="text-[10px] font-extrabold mt-1 tracking-wide text-white">BERANDA</span>
            </button>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';
        const clientDB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // DATA TELEGRAM
        const TELE_TOKEN = '8854342299:AAF3dBZvDDItaPS08hhYI_-0Q4ccm-dKgPs';
        const TELE_ID = '8498622906';

        let keranjang = JSON.parse(localStorage.getItem('keranjangWarungBasecamp')) || [];
        let totalHarga = 0;
        let semuaMenuDB = [];
        let kategoriSaatIni = 'Semua';
        let pesananAktif = null;

        // Listener Real-time Supabase (Termasuk untuk Delete)
        clientDB.channel('public:pesanan_warung')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pesanan_warung' }, payload => {
                let riwayat = JSON.parse(localStorage.getItem('riwayatWarungBasecamp')) || [];
                
                if (payload.eventType === 'UPDATE') {
                    let index = riwayat.findIndex(r => r.id === payload.new.id);
                    if (index !== -1) {
                        riwayat[index].status = payload.new.status;
                        localStorage.setItem('riwayatWarungBasecamp', JSON.stringify(riwayat));
                    }
                    if (pesananAktif && pesananAktif.id === payload.new.id && !document.getElementById('halaman-lacak-visual').classList.contains('hidden')) {
                        pesananAktif.status = payload.new.status;
                        perbaruiVisualLacak();
                    }
                } 
                else if (payload.eventType === 'DELETE') {
                    // Hapus dari riwayat lokal jika admin mendelete
                    let index = riwayat.findIndex(r => r.id === payload.old.id);
                    if (index !== -1) {
                        riwayat.splice(index, 1);
                        localStorage.setItem('riwayatWarungBasecamp', JSON.stringify(riwayat));
                    }
                    // Jika pembeli kebetulan sedang melacak pesanan yang baru saja dihapus admin
                    if (pesananAktif && pesananAktif.id === payload.old.id && !document.getElementById('halaman-lacak-visual').classList.contains('hidden')) {
                        tampilkanNotifikasi("Pesanan ini telah dihapus/direset oleh Admin.", "error");
                        setTimeout(() => { bukaBeranda(); }, 2500);
                    }
                }
            }).subscribe();

        function simpanKeranjangLokal() { localStorage.setItem('keranjangWarungBasecamp', JSON.stringify(keranjang)); }
        
        function tampilkanNotifikasi(pesan, tipe = 'sukses') {
            const toast = document.getElementById('toast');
            const toastContent = document.getElementById('toast-content');
            toastContent.className = tipe === 'sukses' ? 'px-6 py-3 rounded-full shadow-lg text-sm font-bold text-white flex items-center justify-center gap-2 bg-green-500 w-full' : 'px-6 py-3 rounded-full shadow-lg text-sm font-bold text-white flex items-center justify-center gap-2 bg-red-500 w-full';
            toastContent.innerHTML = `<span>${pesan}</span>`;
            toast.classList.remove('-translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('-translate-y-24', 'opacity-0'); }, 3000);
        }

        async function ambilDataMenu() {
            const { data } = await clientDB.from('menu_warung').select('*').order('nama_menu', { ascending: true });
            if(data) { semuaMenuDB = data; renderTombolKategori(); renderMenu(); }
        }

        function renderTombolKategori() {
            const container = document.getElementById('kategori-container');
            container.innerHTML = '';
            let listKategori = ['Semua'];
            semuaMenuDB.forEach(item => { let kat = item.kategori ? item.kategori.trim() : 'Lainnya'; if (!listKategori.includes(kat)) listKategori.push(kat); });
            listKategori.forEach(kat => {
                const isAktif = kat === kategoriSaatIni;
                const classTombol = isAktif ? 'bg-[#d97706] text-white border-[#d97706]' : 'bg-white text-stone-600 border-stone-300';
                container.innerHTML += `<button onclick="pilihKategori('${kat}')" class="${classTombol} px-4 py-1.5 rounded-full text-sm font-bold border transition">${kat}</button>`;
            });
        }

        function pilihKategori(kat) { kategoriSaatIni = kat; renderTombolKategori(); renderMenu(); }

        function renderMenu() {
            const ruangMenu = document.getElementById('ruang-menu');
            ruangMenu.innerHTML = ''; 
            const dataDisaring = semuaMenuDB.filter(item => kategoriSaatIni === 'Semua' || (item.kategori ? item.kategori.trim() : 'Lainnya') === kategoriSaatIni);
            dataDisaring.forEach(item => {
                const gambar = item.foto_url && item.foto_url !== "" ? item.foto_url : 'https://placehold.co/400x300?text=No+Image';
                ruangMenu.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden flex flex-col group">
                        <img src="${gambar}" class="w-full h-32 object-cover">
                        <div class="p-3 flex flex-col flex-grow">
                            <h3 class="font-bold text-stone-800 text-sm leading-tight flex-grow">${item.nama_menu}</h3>
                            <p class="text-[#d97706] font-extrabold text-sm mt-2">Rp ${item.harga.toLocaleString('id-ID')}</p>
                            <button onclick="tambahKeKeranjang('${item.nama_menu.replace(/'/g, "\\'")}', ${item.harga})" class="mt-3 w-full bg-[#d97706] text-white font-bold text-xs py-2.5 rounded-lg active:scale-95 shadow-sm">BELI</button>
                        </div>
                    </div>`;
            });
        }

        function tambahKeKeranjang(nama, harga) {
            const itemAda = keranjang.find(item => item.nama === nama);
            if (itemAda) itemAda.jumlah += 1; else keranjang.push({ nama, harga, jumlah: 1 });
            simpanKeranjangLokal(); updateTampilanKeranjang(); tampilkanNotifikasi("Dimasukkan keranjang! 🛒");
        }

        function ubahJumlahItem(nama, perubahan) {
            const index = keranjang.findIndex(item => item.nama === nama);
            if (index !== -1) {
                keranjang[index].jumlah += perubahan;
                if (keranjang[index].jumlah <= 0) keranjang.splice(index, 1);
                simpanKeranjangLokal(); updateTampilanKeranjang();
            }
        }

        function updateTampilanKeranjang() {
            const badge = document.getElementById('jumlah-item-bawah');
            const listArea = document.getElementById('daftar-pesanan-checkout');
            const teksTotal = document.getElementById('total-harga-checkout');
            if (keranjang.length === 0) {
                badge.classList.add('hidden');
                listArea.innerHTML = `<div class="text-center py-6 text-stone-400">Kosong</div>`;
                teksTotal.innerText = 'Rp 0';
                return;
            }
            badge.classList.remove('hidden');
            let qty = 0; totalHarga = 0; let listHTML = '';
            keranjang.forEach(item => {
                qty += item.jumlah; totalHarga += item.harga * item.jumlah;
                listHTML += `
                    <div class="flex justify-between items-center border-b border-stone-200 py-3 last:border-0">
                        <span class="text-sm font-bold w-1/2 truncate">${item.nama}</span>
                        <div class="flex gap-2">
                            <button onclick="ubahJumlahItem('${item.nama.replace(/'/g, "\\'")}', -1)" class="bg-stone-200 w-6 h-6 rounded-full font-bold">-</button>
                            <span class="text-sm font-bold w-4 text-center">${item.jumlah}</span>
                            <button onclick="ubahJumlahItem('${item.nama.replace(/'/g, "\\'")}', 1)" class="bg-[#d97706] text-white w-6 h-6 rounded-full font-bold">+</button>
                        </div>
                    </div>`;
            });
            badge.innerText = qty; listArea.innerHTML = listHTML; teksTotal.innerText = `Rp ${totalHarga.toLocaleString('id-ID')}`;
        }

        async function kirimKeTelegram(nama, total, daftarItem) {
            let detailPesanan = daftarItem.map(i => `• ${i.jumlah}x ${i.nama}`).join('%0A');
            let pesan = `🔔 *PESANAN BARU MASUK!*%0A%0A` +
                        `👤 *Nama:* ${nama}%0A` +
                        `🛍️ *Pesanan:*%0A${detailPesanan}%0A%0A` +
                        `💰 *Total:* Rp ${total.toLocaleString('id-ID')}%0A%0A` +
                        `🚶 *Segera Proses via Dashboard Admin!*`;

            const url = `https://api.telegram.org/bot${TELE_TOKEN}/sendMessage?chat_id=${TELE_ID}&text=${pesan}&parse_mode=Markdown`;
            try { await fetch(url); } catch (e) { console.error("Gagal kirim Telegram"); }
        }

        async function kirimPesanan() {
            const nama = document.getElementById('nama-pemesan').value;
            const btn = document.getElementById('btn-kirim');
            
            if (keranjang.length === 0 || !nama) return tampilkanNotifikasi("Isi Nama & Keranjang!", "error");
            btn.innerText = "Memproses..."; btn.disabled = true;

            try {
                const { data, error } = await clientDB.from('pesanan_warung').insert([{
                    nama_pemesan: nama, alamat: "-", total_harga: totalHarga, detail_pesanan: keranjang, status: 'Pending'
                }]).select();

                if (error) throw error;

                await kirimKeTelegram(nama, totalHarga, keranjang);

                const orderId = data[0].id; 
                let riwayat = JSON.parse(localStorage.getItem('riwayatWarungBasecamp')) || [];
                
                const pesananBaru = {
                    id: orderId, status: 'Pending',
                    tanggal: new Date().toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
                    nama_pemesan: nama, total_harga: totalHarga, metode: 'COD', detail_pesanan: keranjang
                };
                
                riwayat.unshift(pesananBaru);
                localStorage.setItem('riwayatWarungBasecamp', JSON.stringify(riwayat));
                
                keranjang = []; simpanKeranjangLokal(); updateTampilanKeranjang(); tutupCheckout();
                document.getElementById('nama-pemesan').value = ''; 
                
                tampilkanNotifikasi("Pesanan Berhasil Dibuat!");
                
                setTimeout(() => { 
                    pesananAktif = pesananBaru;
                    bukaLacakVisual(); 
                }, 1000);

            } catch (err) { tampilkanNotifikasi("Gagal kirim!", "error"); } 
            finally { btn.innerText = "Kirim Pesanan"; btn.disabled = false; }
        }

        // KONTROL NAVIGASI
        function bukaBeranda() { 
            document.getElementById('halaman-beranda').classList.remove('hidden'); 
            document.getElementById('header-utama').classList.remove('hidden');
            document.getElementById('halaman-lacak-visual').classList.add('hidden'); 
        }
        function bukaCheckout() { document.getElementById('modal-checkout').classList.remove('hidden'); }
        function tutupCheckout() { document.getElementById('modal-checkout').classList.add('hidden'); }
        
        // KONTROL FITUR LACAK
        function bukaModalLacak() { 
            document.getElementById('modal-lacak').classList.remove('hidden'); 
            document.getElementById('input-nama-lacak').focus();
        }
        function tutupModalLacak() { 
            document.getElementById('modal-lacak').classList.add('hidden'); 
            document.getElementById('input-nama-lacak').value = '';
        }

        // MENCARI DATA LANGSUNG KE SUPABASE
        async function cariPesanan() {
            const namaCari = document.getElementById('input-nama-lacak').value.trim();
            if (!namaCari) return tampilkanNotifikasi("Masukkan nama terlebih dahulu!", "error");

            const btn = document.getElementById('btn-cari-lacak');
            btn.innerText = "MENCARI..."; 
            btn.disabled = true;

            try {
                // Query ke Supabase mencari nama yang cocok (ilike = tidak peduli huruf besar/kecil), ambil pesanan terbaru
                const { data, error } = await clientDB
                    .from('pesanan_warung')
                    .select('*')
                    .ilike('nama_pemesan', namaCari)
                    .order('id', { ascending: false })
                    .limit(1);

                if (error) throw error;

                if (data && data.length > 0) {
                    pesananAktif = data[0];
                    tutupModalLacak();
                    bukaLacakVisual();
                    tampilkanNotifikasi("Pesanan ditemukan!");
                } else {
                    tampilkanNotifikasi("Pesanan tidak ditemukan/sudah dihapus admin!", "error");
                }
            } catch (err) { 
                tampilkanNotifikasi("Gagal mencari data!", "error"); 
                console.error(err);
            } finally { 
                btn.innerText = "CARI"; 
                btn.disabled = false; 
            }
        }

        function bukaLacakVisual() {
            document.getElementById('halaman-beranda').classList.add('hidden');
            document.getElementById('header-utama').classList.add('hidden'); 
            document.getElementById('halaman-lacak-visual').classList.remove('hidden');
            document.getElementById('halaman-lacak-visual').classList.add('flex');
            
            perbaruiVisualLacak();
        }

        function perbaruiVisualLacak() {
            if (!pesananAktif) return;

            const teksStatus = document.getElementById('teks-status-lacak');
            const ikonKurir = document.getElementById('ikon-kurir');
            const pesanMotivasi = document.getElementById('pesan-motivasi');

            ikonKurir.className = 'absolute text-5xl transition-all duration-1000 ease-in-out z-20';

            switch (pesananAktif.status) {
                case 'Pending':
                    teksStatus.innerText = "MENUNGGU KONFIRMASI";
                    ikonKurir.style.left = "10%";
                    ikonKurir.style.top = "55%";
                    ikonKurir.classList.add('kurir-diam');
                    pesanMotivasi.innerText = '"Mohon tunggu ya, warung sedang mengecek pesananmu!"';
                    break;
                case 'Diproses':
                    teksStatus.innerText = "SEDANG DISIAPKAN";
                    ikonKurir.style.left = "10%";
                    ikonKurir.style.top = "55%";
                    ikonKurir.classList.add('animasi-kurir-jalan');
                    pesanMotivasi.innerText = '"Mantap! Kopi dan udutmu sedang disiapkan!"';
                    break;
                case 'Dikirim':
                    teksStatus.innerText = "SEDANG DIANTAR";
                    ikonKurir.style.left = "45%";
                    ikonKurir.style.top = "35%";
                    ikonKurir.classList.add('animasi-kurir-jalan');
                    pesanMotivasi.innerText = '"Siap-siap! Kurir berjalan menuju lokasimu 🏃‍♂️💨"';
                    break;
                case 'Selesai':
                    teksStatus.innerText = "PESANAN TIBA";
                    ikonKurir.style.left = "75%";
                    ikonKurir.style.top = "15%";
                    ikonKurir.classList.add('kurir-diam');
                    pesanMotivasi.innerText = '"Pesanan sudah sampai. Selamat ngopi dan udut! ☕🚬"';
                    break;
                default:
                    teksStatus.innerText = "MEMUAT...";
                    break;
            }
        }

        updateTampilanKeranjang(); ambilDataMenu();
    </script>
</body>
</html>
