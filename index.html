<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Basecamp Coffee - Pesan Antar</title>
    
    <!-- Memanggil Tailwind CSS untuk desain -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Memanggil Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-100 p-4 font-sans">

    <!-- Container Utama -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg rounded-xl overflow-hidden border border-stone-200">
        
        <!-- Header Aplikasi (Tema Coffee Shop) -->
        <div class="bg-stone-800 text-amber-50 p-4 sticky top-0 z-10 shadow-md border-b-4 border-amber-600">
            <h1 class="text-2xl font-bold text-center tracking-wide">☕ Warung Basecamp Coffee</h1>
            <p class="text-center text-sm text-stone-300 mt-1">Layanan antar langsung ke tempatmu</p>
        </div>

        <!-- Area Daftar Menu -->
        <div class="p-4 bg-stone-50 min-h-screen">
            <h2 class="text-lg font-bold mb-4 text-stone-800 border-b-2 border-stone-200 pb-2">Daftar Menu</h2>
            
            <!-- Tempat menu akan dimunculkan -->
            <div id="ruang-menu" class="grid grid-cols-2 gap-4">
                <!-- Data dari Supabase masuk ke sini otomatis -->
            </div>
        </div>
        
    </div>

    <!-- Skrip JavaScript -->
    <script>
        // 1. Kredensial Supabase (Sudah Otomatis Terisi)
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';

        // 2. Koneksi ke Supabase
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 3. Fungsi Ambil Data Menu
        async function ambilDataMenu() {
            const ruangMenu = document.getElementById('ruang-menu');
            ruangMenu.innerHTML = '<p class="col-span-2 text-center text-stone-500 py-10 font-medium animate-pulse">Menyiapkan menu...</p>';

            // Mengambil data dari tabel menu_warung
            const { data, error } = await supabase
                .from('menu_warung')
                .select('*')
                .order('nama_menu', { ascending: true });

            if (error) {
                console.error('Error Supabase:', error);
                ruangMenu.innerHTML = '<p class="col-span-2 text-center text-red-600 py-10 font-bold">Gagal terhubung ke database.</p>';
                return;
            }

            ruangMenu.innerHTML = '';

            if (data.length === 0) {
                ruangMenu.innerHTML = '<p class="col-span-2 text-center text-stone-500 py-10">Belum ada menu yang ditambahkan di database.</p>';
                return;
            }

            // 4. Looping untuk menampilkan setiap menu
            data.forEach(item => {
                const gambar = item.foto_url && item.foto_url !== "" ? item.foto_url : 'https://placehold.co/400x300/e7e5e4/a8a29e?text=Belum+Ada+Foto';

                const kadMenuHTML = `
                    <div class="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden flex flex-col relative group hover:shadow-md transition-all">
                        <img src="${gambar}" alt="${item.nama_menu}" class="w-full h-32 object-cover">
                        <div class="p-3 flex flex-col flex-grow">
                            <h3 class="font-bold text-stone-800 text-sm leading-tight flex-grow">${item.nama_menu}</h3>
                            <p class="text-amber-700 font-extrabold text-sm mt-2">Rp ${item.harga.toLocaleString('id-ID')}</p>
                            
                            <button onclick="pesanBarang('${item.nama_menu}', ${item.harga})" class="mt-3 w-full bg-amber-600 text-white font-bold text-xs py-2.5 rounded-lg hover:bg-amber-700 active:bg-amber-800 transition duration-150 shadow-sm">
                                + Pesan
                            </button>
                        </div>
                    </div>
                `;
                
                ruangMenu.innerHTML += kadMenuHTML;
            });
        }

        // Fungsi ketika tombol pesan ditekan
        function pesanBarang(nama, harga) {
            alert(`Sip! ${nama} (Rp ${harga.toLocaleString('id-ID')}) siap diproses.`);
        }

        // Langsung jalankan saat web dibuka
        ambilDataMenu();
    </script>
</body>
</html>
