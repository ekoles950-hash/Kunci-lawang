<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basecamp Coffee - Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        @keyframes jalan { 0% { transform: translateX(-20px); } 50% { transform: translateX(20px); } 100% { transform: translateX(-20px); } }
        .animasi-orang { animation: jalan 2s infinite ease-in-out; font-size: 30px; display: inline-block; }
    </style>
</head>
<body class="bg-stone-100 font-sans pb-24">

    <div id="app-container" class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative">
        <div class="bg-[#292524] text-amber-50 p-4 sticky top-0 z-10 shadow-md">
            <h1 class="text-xl font-extrabold text-center text-[#f59e0b]">☕ WARUNG KOPI SIAP ANTAR</h1>
        </div>

        <div id="halaman-beranda" class="p-4">
            <h2 class="text-lg font-bold mb-3">Daftar Menu</h2>
            <div id="ruang-menu" class="grid grid-cols-2 gap-4"></div>
        </div>

        <div id="halaman-lacak" class="p-4 hidden">
            <h2 class="text-lg font-bold mb-4">Status Pesanan</h2>
            <div id="daftar-riwayat" class="space-y-4"></div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t z-50 flex justify-around p-3 shadow-lg">
        <button onclick="pindah('beranda')" class="flex flex-col items-center text-xs font-bold">🏠 Beranda</button>
        <button onclick="bukaCheckout()" class="flex flex-col items-center text-xs font-bold">🛒 Keranjang</button>
        <button onclick="window.location.href='topup.html'" class="flex flex-col items-center text-xs font-bold text-blue-600">💳 Top Up</button>
        <button onclick="pindah('lacak')" class="flex flex-col items-center text-xs font-bold">📍 Lacak</button>
    </div>

    <script>
        const clientDB = window.supabase.createClient('https://butydxuauhtvwojvpixt.supabase.co', 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X');

        function pindah(hal) {
            document.getElementById('halaman-beranda').classList.toggle('hidden', hal !== 'beranda');
            document.getElementById('halaman-lacak').classList.toggle('hidden', hal !== 'lacak');
            if(hal === 'lacak') renderRiwayat();
        }

        function renderRiwayat() {
            const area = document.getElementById('daftar-riwayat');
            let riwayat = JSON.parse(localStorage.getItem('riwayatWarungBasecamp')) || [];
            area.innerHTML = riwayat.length === 0 ? `<div class="text-center py-10">Belum ada pesanan.</div>` : '';
            riwayat.forEach(p => {
                let statusInfo = p.status === 'Dikirim' ? '🛵 Sedang diantar...' : '🕒 Pending';
                let animasi = (p.status === 'Diproses' || p.status === 'Dikirim') ? '<div class="animasi-orang">🚶</div>' : '';
                area.innerHTML += `<div class="bg-white p-4 rounded-xl border shadow-sm text-center">${animasi}<p class="font-bold">${p.nama_pemesan}</p><p class="text-stone-500 text-sm">${statusInfo}</p></div>`;
            });
        }

        // Fungsi lainnya tetap sama...
        async function kirimPesanan() { /* ... logika kirim ke supabase & telegram ... */ }
    </script>
</body>
</html>
