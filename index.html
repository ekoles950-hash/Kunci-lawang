<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Basecamp Coffee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-100 font-sans pb-10">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg overflow-hidden border border-stone-200 relative">
        
        <!-- Header -->
        <div class="bg-stone-800 text-amber-50 p-4 sticky top-0 z-10 shadow-md border-b-4 border-amber-600">
            <h1 class="text-2xl font-bold text-center tracking-wide">☕ Warung Basecamp Coffee</h1>
            <p class="text-center text-sm text-stone-300 mt-1">Layanan antar langsung ke tempatmu</p>
        </div>

        <!-- Area Menu & Keranjang -->
        <div class="p-4 bg-stone-50 min-h-screen">
            
            <!-- Judul & Tombol Keranjang Samping -->
            <div class="flex justify-between items-center mb-4 border-b-2 border-stone-200 pb-2 sticky top-[76px] bg-stone-50 z-10 py-2">
                <h2 class="text-lg font-bold text-stone-800">Daftar Menu</h2>
                
                <!-- Tombol Keranjang (Tersembunyi jika kosong) -->
                <button id="keranjang-samping" onclick="bukaCheckout()" class="hidden flex items-center gap-2 bg-amber-600 text-white px-4 py-1.5 rounded-full shadow-md hover:bg-amber-700 transition active:scale-95">
                    <span class="text-sm font-bold">🛒 <span id="jumlah-item-samping" class="bg-white text-amber-700 px-2 py-0.5 rounded-full ml-1">0</span></span>
                </button>
            </div>

            <!-- Daftar Menu Grid -->
            <div id="ruang-menu" class="grid grid-cols-2 gap-4">
                <p class="col-span-2 text-center text-stone-500 py-10 font-medium animate-pulse">Menyiapkan menu...</p>
            </div>
        </div>

        <!-- Modal/Popup Checkout -->
        <div id="modal-checkout" class="hidden fixed inset-0 bg-black/60 z-50 flex justify-center items-end sm:items-center">
            <div class="bg-white w-full max-w-md p-6 rounded-t-2xl sm:rounded-2xl shadow-2xl animate-[slideUp_0.3s_ease-out]">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-bold text-stone-800">Detail Pesanan</h2>
                    <button onclick="tutupCheckout()" class="text-stone-400 hover:text-red-500 font-bold text-3xl leading-none">&times;</button>
                </div>

                <!-- Ringkasan Belanja -->
                <div class="mb-4 bg-stone-100 p-3 rounded-lg border border-stone-200">
                    <p class="text-xs font-bold text-stone-500 uppercase mb-2 border-b border-stone-300 pb-1">Pesanan Anda:</p>
                    <div id="daftar-pesanan-checkout" class="text-sm text-stone-700 space-y-1 mb-2 max-h-24 overflow-y-auto">
                        <!-- List item masuk sini -->
                    </div>
                    <div class="flex justify-between items-center border-t border-stone-300 pt-2 mt-2">
                        <span class="font-bold text-stone-800">Total Harga:</span>
                        <span id="total-harga-checkout" class="font-extrabold text-amber-700 text-lg">Rp 0</span>
                    </div>
                </div>

                <div class="space-y-4">
                    <!-- Form Nama -->
                    <div>
                        <label class="block text-stone-700 font-bold text-sm mb-1" for="nama-pemesan">Nama Pemesan</label>
                        <input type="text" id="nama-pemesan" class="w-full border-2 border-stone-300 rounded-lg p-2 focus:border-amber-500 focus:outline-none bg-white" placeholder="Masukkan nama...">
                    </div>

                    <!-- Form Metode Pembayaran -->
                    <div>
                        <label class="block text-stone-700 font-bold text-sm mb-1" for="metode-bayar">Metode Pembayaran</label>
                        <select id="metode-bayar" class="w-full border-2 border-stone-300 rounded-lg p-2 bg-stone-50 text-stone-700 font-medium outline-none focus:border-amber-500">
                            <option value="COD">💵 Bayar di Tempat (COD)</option>
                        </select>
                    </div>
                </div>

                <div class="mt-6">
                    <button id="btn-kirim" onclick="kirimPesanan()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-lg text-lg transition active:scale-95">
                        Pesan Sekarang
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';
        const clientDB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let keranjang = [];
        let totalHarga = 0;

        async function ambilDataMenu() {
            const ruangMenu = document.getElementById('ruang-menu');
            try {
                const { data, error } = await clientDB.from('menu_warung').select('*').order('nama_menu', { ascending: true });
                if (error) throw error; 

                ruangMenu.innerHTML = ''; 
                if (data.length === 0) {
                    ruangMenu.innerHTML = '<p class="col-span-2 text-center text-stone-500 py-10">Belum ada menu.</p>';
                    return;
                }

                data.forEach(item => {
                    const gambar = item.foto_url && item.foto_url !== "" ? item.foto_url : 'https://placehold.co/400x300/e7e5e4/a8a29e?text=No+Image';
                    const kadMenuHTML = `
                        <div class="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden flex flex-col relative group">
                            <img src="${gambar}" alt="${item.nama_menu}" class="w-full h-32 object-cover">
                            <div class="p-3 flex flex-col flex-grow">
                                <h3 class="font-bold text-stone-800 text-sm leading-tight flex-grow">${item.nama_menu}</h3>
                                <p class="text-amber-700 font-extrabold text-sm mt-2">Rp ${item.harga.toLocaleString('id-ID')}</p>
                                <!-- Tombol Diganti Menjadi BELI -->
                                <button onclick="tambahKeKeranjang('${item.nama_menu}', ${item.harga})" class="mt-3 w-full bg-amber-600 text-white font-bold text-xs py-2.5 rounded-lg active:bg-amber-800 transition">
                                    BELI
                                </button>
                            </div>
                        </div>
                    `;
                    ruangMenu.innerHTML += kadMenuHTML;
                });
            } catch (err) {
                ruangMenu.innerHTML = `<p class="col-span-2 text-center text-red-500 font-bold text-sm">Error: ${err.message}</p>`;
            }
        }

        function tambahKeKeranjang(nama, harga) {
            const itemAda = keranjang.find(item => item.nama === nama);
            if (itemAda) {
                itemAda.jumlah += 1;
            } else {
                keranjang.push({ nama: nama, harga: harga, jumlah: 1 });
            }
            updateTampilanKeranjang();
            
            // Efek animasi kecil saat tombol beli ditekan
            const tombolKeranjang = document.getElementById('keranjang-samping');
            tombolKeranjang.classList.add('scale-110');
            setTimeout(() => tombolKeranjang.classList.remove('scale-110'), 200);
        }

        function updateTampilanKeranjang() {
            const keranjangSamping = document.getElementById('keranjang-samping');
            const jumlahItemSamping = document.getElementById('jumlah-item-samping');
            const daftarPesananCheckout = document.getElementById('daftar-pesanan-checkout');
            const totalHargaCheckout = document.getElementById('total-harga-checkout');

            if (keranjang.length === 0) {
                keranjangSamping.classList.add('hidden');
                return;
            }

            keranjangSamping.classList.remove('hidden');
            
            let totalQty = 0;
            totalHarga = 0;
            let listHTML = '';

            keranjang.forEach(item => {
                totalQty += item.jumlah;
                const subtotal = item.harga * item.jumlah;
                totalHarga += subtotal;
                
                // Format isi ringkasan keranjang di dalam popup
                listHTML += `
                    <div class="flex justify-between items-center">
                        <span>${item.jumlah}x ${item.nama}</span>
                        <span class="font-medium">Rp ${subtotal.toLocaleString('id-ID')}</span>
                    </div>
                `;
            });

            jumlahItemSamping.innerText = totalQty;
            daftarPesananCheckout.innerHTML = listHTML;
            totalHargaCheckout.innerText = `Rp ${totalHarga.toLocaleString('id-ID')}`;
        }

        function bukaCheckout() {
            document.getElementById('modal-checkout').classList.remove('hidden');
        }
        
        function tutupCheckout() {
            document.getElementById('modal-checkout').classList.add('hidden');
        }

        async function kirimPesanan() {
            const nama = document.getElementById('nama-pemesan').value;
            const metode = document.getElementById('metode-bayar').value;
            const btnKirim = document.getElementById('btn-kirim');

            if (!nama) {
                alert("Harap isi Nama pemesan!");
                return;
            }

            btnKirim.innerText = "Memproses...";
            btnKirim.disabled = true;
            btnKirim.classList.replace('bg-green-600', 'bg-stone-400');

            try {
                const { error } = await clientDB.from('pesanan_warung').insert([
                    {
                        nama_pemesan: nama,
                        alamat: "-", 
                        metode_pembayaran: metode,
                        total_harga: totalHarga,
                        detail_pesanan: keranjang
                    }
                ]);

                if (error) throw error;

                alert("✅ Pesanan berhasil dikirim!");
                
                keranjang = [];
                updateTampilanKeranjang();
                tutupCheckout();
                document.getElementById('nama-pemesan').value = '';

            } catch (err) {
                alert("Gagal mengirim pesanan: " + err.message);
            } finally {
                btnKirim.innerText = "Pesan Sekarang";
                btnKirim.disabled = false;
                btnKirim.classList.replace('bg-stone-400', 'bg-green-600');
            }
        }

        ambilDataMenu();
    </script>
</body>
</html>
